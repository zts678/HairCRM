{% extends "base.html" %}
{% block title %}修改密码 - {{ shop_name }}会员管理系统{% endblock %}
{% block page_title %}修改密码{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card" style="max-width:480px;margin:0 auto">
        <div class="form-card-header">
            <i class="fas fa-key"></i> 修改密码（{{ session.get('username') }}）
        </div>
        <form method="POST" action="{{ url_for('change_password') }}">
            <div class="form-section">
                <label>原密码</label>
                <input type="password" name="old_password" placeholder="请输入原密码" class="form-input" required>
            </div>
            <div class="form-section">
                <label>新密码</label>
                <input type="password" name="new_password" placeholder="请输入新密码" class="form-input" required>
            </div>
            <div class="form-section">
                <label>确认新密码</label>
                <input type="password" name="confirm_password" placeholder="再次输入新密码" class="form-input" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-check"></i> 确认修改</button>
        </form>
    </div>
</div>
{% endblock %}
